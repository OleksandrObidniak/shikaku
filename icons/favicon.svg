<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#1A1A2E"/>
  <!-- p=2, g=1, c=6.25, step=7.25 → 2+4*6.25+3*1+2=32 -->
  <!-- C coral: rows 0-1, cols 0-1 -->
  <rect x="2"     y="2"     width="13.5"  height="13.5"  rx="1" fill="#E05C5C"/>
  <!-- B blue: rows 0-2, cols 2-3 -->
  <rect x="16.5"  y="2"     width="13.5"  height="20.75" rx="1" fill="#5B9BD5"/>
  <!-- A amber: rows 2-3, col 0 -->
  <rect x="2"     y="16.5"  width="6.25"  height="13.5"  rx="1" fill="#F5A623"/>
  <!-- T teal: row 2, col 1 -->
  <rect x="9.25"  y="16.5"  width="6.25"  height="6.25"  rx="1" fill="#4CAF82"/>
  <!-- P purple: row 3, cols 1-3 -->
  <rect x="9.25"  y="23.75" width="20.75" height="6.25"  rx="1" fill="#8B6BB1"/>
</svg>
